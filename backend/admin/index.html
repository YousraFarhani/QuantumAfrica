<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum Africa — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* The panel wears the same palette as the site so editing does not feel like
   leaving it. It is deliberately plainer: this is a workbench, not a shop window. */
:root{
  --navy:#001F3F; --navy-d:#00162E; --navy-l:#0A3357;
  --gold:#C9A55B; --gold-l:#E2C68C; --green:#007736; --red:#B3402F;
  --bg:#F7F5F0; --card:#fff; --line:rgba(0,31,63,.14); --line-2:rgba(0,31,63,.26);
  --ink:#001F3F; --ink-2:#4A5768; --ink-3:#8A8F97;
  --f:"Gotham","Gotham HTF",Poppins,"Helvetica Neue",Arial,sans-serif;
  --sidebar:264px;
}
@font-face{font-family:"Gotham";src:url("assets/fonts/Gotham-Book.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Gotham";src:url("assets/fonts/Gotham-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Gotham";src:url("assets/fonts/Gotham-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-l)}
.hidden{display:none!important}

/* ---------------- sign in ---------------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--navy-l),var(--navy) 55%,var(--navy-d));z-index:50;padding:24px}
.lbox{width:min(420px,100%);background:var(--card);border-radius:8px;padding:38px 34px;
  box-shadow:0 40px 90px -30px rgba(0,22,46,.7)}
.lbox h1{margin:0 0 6px;font-size:1.5rem;letter-spacing:-.03em}
.lbox p{margin:0 0 26px;color:var(--ink-3);font-size:.9rem}
.lbox label{display:block;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;color:var(--ink-2);margin-bottom:8px}
.lbox input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:4px;background:#fff}
.lbox input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.lbox .err{color:var(--red);font-size:.85rem;margin-top:12px;min-height:20px}

/* ---------------- shell ---------------- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100%}
aside{background:var(--navy);color:#fff;padding:22px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:16px}
.brand b{display:block;font-weight:700;font-size:1rem;letter-spacing:-.02em}
.brand span{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l)}
.snav{display:flex;flex-direction:column;gap:1px;padding:0 10px}
.snav .grp{padding:14px 12px 6px;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-l);font-weight:600;user-select:none}
.snav .grp:first-child{padding-top:2px}
.snav .sep{height:1px;background:rgba(255,255,255,.1);margin:4px 0}
.snav button{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:10px 12px;
  color:rgba(255,255,255,.72);cursor:pointer;font-size:.9rem;transition:background .15s,color .15s}
.snav button:hover{background:rgba(255,255,255,.07);color:#fff}
.snav button.on{background:var(--gold);color:var(--navy);font-weight:600}
.snav .n{font-size:.68rem;opacity:.7;font-variant-numeric:tabular-nums}
.snav button.on .n{opacity:.85}
.side-foot{padding:20px 22px 0;margin-top:20px;border-top:1px solid rgba(255,255,255,.14);
  font-size:.75rem;color:rgba(255,255,255,.5);display:flex;flex-direction:column;gap:10px}
.side-foot a{color:var(--gold-l)}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);
  border-radius:4px;padding:7px 10px;cursor:pointer;font-size:.75rem;text-align:left}
.side-foot button:hover{border-color:var(--gold);color:var(--gold-l)}

main{padding:0 0 120px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 34px;display:flex;align-items:center;
  justify-content:space-between;gap:18px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:1.2rem;letter-spacing:-.03em}
.topbar .blurb{color:var(--ink-3);font-size:.82rem;max-width:64ch;margin-top:3px}
.tb-r{display:flex;align-items:center;gap:10px}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:9px 16px;
  cursor:pointer;font-weight:600;font-size:.85rem;transition:all .15s}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-l)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:none}
.btn.danger{color:var(--red);border-color:rgba(179,64,47,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:7px}

.wrap{padding:28px 34px;max-width:1080px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:18px}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field .help{font-size:.78rem;color:var(--ink-3);margin:-3px 0 8px}
.field input[type=text],.field input[type=url],.field input[type=email],
.field input[type=date],.field input[type=time],.field input[type=number],
.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:4px;background:#fff}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field textarea.md{min-height:190px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}#app{grid-template-columns:1fr}
  aside{position:static;height:auto}}

/* modal dialogs (replace window.confirm/prompt so they work inside iframe & popup blockers) */
.modal{position:fixed;inset:0;background:rgba(0,22,46,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal .m-box{width:min(460px,100%);background:var(--card);border-radius:8px;padding:26px 24px;
  box-shadow:0 30px 80px -20px rgba(0,22,46,.6)}
.modal h3{margin:0 0 10px;font-size:1.1rem;letter-spacing:-.02em}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:.9rem;line-height:1.55;white-space:pre-wrap}
.modal input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:4px;background:#fff;
  font-size:.92rem;margin-bottom:18px}
.modal input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.modal .m-actions{display:flex;justify-content:flex-end;gap:10px}

/* image field */
.img-f{display:flex;gap:16px;align-items:flex-start}
.img-p{width:132px;height:132px;flex:none;border:1.5px dashed var(--line-2);border-radius:4px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;
  color:var(--ink-3);font-size:.72rem;text-align:center;padding:8px}
.img-p img,.img-p video{width:100%;height:100%;object-fit:cover}
.img-a{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.img-a .row{display:flex;gap:8px;flex-wrap:wrap}
.img-a input{width:100%}

/* repeatable list */
.list-rows{display:flex;flex-direction:column;gap:10px}
.row-item{border:1px solid var(--line);border-radius:5px;background:#fff;overflow:hidden}
.row-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:#fff}
.row-hd:hover{background:var(--bg)}
.row-hd .grip{color:var(--ink-3);cursor:grab;font-size:1rem;line-height:1}
.row-hd .t{flex:1;font-weight:600;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-hd .t.empty{color:var(--ink-3);font-weight:400;font-style:italic}
.row-hd .x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:1.1rem;padding:0 4px}
.row-hd .x:hover{color:var(--red)}
.row-b{padding:20px;border-top:1px solid var(--line);background:var(--bg)}
.row-item.dragging{opacity:.45}
.row-item.over{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,165,91,.3)}

/* collection list */
.coll{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.coll{grid-template-columns:1fr}}
.coll-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:104px}
.coll-list .entry{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:stretch;
  border:1px solid var(--line);border-radius:4px;background:#fff;overflow:hidden}
.coll-list .entry.dragging{opacity:.45}
.coll-list .entry.over{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,165,91,.3)}
.coll-list .row-grip{display:flex;align-items:center;justify-content:center;cursor:grab;
  color:var(--ink-3);background:color-mix(in srgb,var(--ink-1) 26%,transparent);
  font-size:.95rem;letter-spacing:-3px;user-select:none}
.coll-list .row-grip:hover{color:var(--navy);background:color-mix(in srgb,var(--gold) 30%,transparent)}
.coll-list .entry .nb{text-align:left;background:transparent;border:0;border-radius:0;
  padding:11px 10px 11px 8px;cursor:pointer;font-size:.88rem;width:100%;
  display:flex;flex-direction:column;gap:3px;justify-content:center}
.coll-list .entry .nb.on{background:var(--navy);color:#fff}
.coll-list .entry .nb .sub{font-size:.72rem;color:var(--ink-3)}
.coll-list .entry .nb.on .sub{color:rgba(255,255,255,.6)}
.coll-list .mvs{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.coll-list .mvs button{width:28px;height:50%;background:#fff;border:0;color:var(--ink-3);
  cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.coll-list .mvs button:hover{background:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--navy)}
.coll-list .mvs button:disabled{opacity:.22;cursor:default;background:#fff}
.coll-list .mvs button + button{border-top:1px solid var(--line)}
.empty-note{color:var(--ink-3);font-size:.88rem;padding:18px 0}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:5px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--red)}

.rev{display:flex;justify-content:space-between;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.rev:last-child{border-bottom:0}
.rev .when{color:var(--ink-3);font-size:.8rem}
.banner{background:#fff;border:1px solid var(--gold);border-left-width:4px;border-radius:5px;
  padding:14px 18px;margin-bottom:18px;font-size:.87rem;color:var(--ink-2)}
code{background:rgba(0,31,63,.07);padding:1px 5px;border-radius:3px;font-size:.88em}

/* Design system reference page — same palette + typography as the website,
   rendered inside the admin workbench so an editor can see/use without going
   to the public site. */
.ds-grid{display:grid;gap:18px}
.ds-grid.g3{grid-template-columns:repeat(3,1fr)}
.ds-grid.g2{grid-template-columns:repeat(2,1fr)}
.ds-grid.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.ds-grid.g3,.ds-grid.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.ds-grid.g2,.ds-grid.g3,.ds-grid.g4{grid-template-columns:1fr}}
.ds-swatch{height:76px;border-bottom:1px solid var(--line);border-radius:4px 4px 0 0}
.ds-chip{display:inline-block;background:rgba(0,31,63,.06);color:var(--ink-2);
  border-radius:1000px;padding:2px 10px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.ds-gradline{height:6px;background:linear-gradient(90deg,var(--navy),var(--gold))}
.ds-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;
  letter-spacing:.04em;color:var(--ink-2)}
.ds-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:1000px;
  font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid rgba(0,31,63,.2);color:var(--ink-2)}
.ds-pill.current{background:var(--green);color:#fff;border-color:transparent}
.ds-pill.dev{background:#6D5DA6;color:#fff;border-color:transparent}
.ds-pill.future{background:var(--gold);color:var(--navy);border-color:transparent}
.ds-hrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:12px;
  margin-bottom:22px;border-bottom:1px dashed var(--line)}
.ds-hrow .lbl{font-size:.7rem;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.ds-hrow h2{margin:0;font-size:1.4rem;letter-spacing:-.02em}
.ds-hrow p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm">
    <h1>Quantum Africa</h1>
    <p>Admin panel</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><b>Quantum Africa</b><span>Admin</span></div>
    <nav class="snav" id="snav"></nav>
    <div class="side-foot">
      <button type="button" id="subBtn">Form submissions</button>
      <button type="button" id="revBtn">Revision history</button>
      <button type="button" id="viewBtn">Open the website</button>
      <button type="button" id="outBtn">Sign out</button>
      <span id="savedAt"></span>
      <span id="pubState"></span>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="secTitle">—</h2>
        <div class="blurb" id="secBlurb"></div>
      </div>
      <div class="tb-r">
        <span id="dirty" class="hidden" style="font-size:.82rem;color:var(--ink-2)"><span class="dirty-dot"></span>Unsaved changes</span>
        <button class="btn ghost" id="revertBtn" disabled>Revert</button>
        <button class="btn" id="saveBtn" disabled>Save</button>
        <button class="btn gold" id="pubBtn" title="Send everything you have saved to the live website">Publish to the website</button>
      </div>
    </div>
    <div class="wrap" id="pane"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Quantum Africa admin panel.

   Renders itself from the schema the server publishes, so a new field on the
   site never needs a change here. Everything is one document: load it, edit a
   section, save it back. Saving writes a revision, so nothing is ever lost.
   ===================================================================== */

const API = location.pathname.replace(/\/admin\/?$/, '') || '';
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if(c) n.className = c;
  if(h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let TOKEN = localStorage.getItem('qa_admin_token') || '';
let SCHEMA = null, DOC = null, CLEAN = null, SECTION = null, ROW = 0;

/* ---------------------------------------------------------------- network */
async function api(path, opts){
  const o = Object.assign({headers:{}}, opts || {});
  o.headers['X-Admin-Session'] = TOKEN;
  if(o.body && !(o.body instanceof FormData)){
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(o.body);
  }
  const r = await fetch(API + path, o);
  if(r.status === 401){ signOut(); throw new Error('Session expired — sign in again.'); }
  if(!r.ok){
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch(e){}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

function toast(msg, bad){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.className = 'toast', 3200);
}

/* ------- in-DOM confirm / prompt so iframe + popup blocker contexts work ------ */
function qa_confirm(message, okLabel, cancelLabel){
  return new Promise(resolve => {
    const m = el('div','modal');
    const box = el('div','m-box');
    box.appendChild(el('h3','','Confirm'));
    box.appendChild(el('p','',esc(message)));
    const row = el('div','m-actions');
    const cancel = el('button','btn ghost',cancelLabel || 'Cancel');
    const ok = el('button','btn primary',okLabel || 'OK');
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row); m.appendChild(box); document.body.appendChild(m);
    ok.focus();
    const close = v => { try{ document.body.removeChild(m); }catch(_){} resolve(v); };
    cancel.addEventListener('click', ()=> close(false));
    ok.addEventListener('click', ()=> close(true));
    m.addEventListener('click', e => { if(e.target === m) close(false); });
    const kh = e => { if(e.key === 'Enter'){ e.preventDefault(); close(true); }
      else if(e.key === 'Escape'){ e.preventDefault(); close(false); } };
    document.addEventListener('keydown', kh, {once:true});
  });
}
function qa_prompt(message, initialValue, okLabel, cancelLabel){
  return new Promise(resolve => {
    const m = el('div','modal');
    const box = el('div','m-box');
    box.appendChild(el('h3','','Describe this update'));
    box.appendChild(el('p','',esc(message)));
    const input = el('input'); input.type = 'text'; input.value = initialValue == null ? '' : String(initialValue);
    box.appendChild(input);
    const row = el('div','m-actions');
    const cancel = el('button','btn ghost',cancelLabel || 'Cancel');
    const ok = el('button','btn gold',okLabel || 'Publish');
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row); m.appendChild(box); document.body.appendChild(m);
    setTimeout(()=>{ input.focus(); input.select(); },10);
    const close = v => { try{ document.body.removeChild(m); }catch(_){} resolve(v); };
    cancel.addEventListener('click', ()=> close(null));
    ok.addEventListener('click', ()=> close(input.value));
    m.addEventListener('click', e => { if(e.target === m) close(null); });
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); close(input.value); }
      else if(e.key === 'Escape'){ e.preventDefault(); close(null); }
    });
  });
}

/* ---------------------------------------------------------------- session */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#loginErr'); err.textContent = '';
  try{
    const r = await fetch(API + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: $('#pw').value}) });
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      err.textContent = d.detail || 'Could not sign in.';
      return;
    }
    const d = await r.json();
    TOKEN = d.token;
    localStorage.setItem('qa_admin_token', TOKEN);
    start();
  }catch(ex){ err.textContent = 'Cannot reach the server.'; }
});

function signOut(){
  TOKEN = '';
  localStorage.removeItem('qa_admin_token');
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#pw').value = '';
}
$('#outBtn').addEventListener('click', signOut);
$('#viewBtn').addEventListener('click', ()=> window.open(API + '/preview', '_blank'));

/* ------------------------------------------------------------------ state */
const clone = o => JSON.parse(JSON.stringify(o));
const dirty = () => JSON.stringify(DOC) !== JSON.stringify(CLEAN);

function markDirty(){
  const d = dirty();
  $('#dirty').classList.toggle('hidden', !d);
  $('#saveBtn').disabled = !d;
  $('#revertBtn').disabled = !d;
}

window.addEventListener('beforeunload', e => {
  if(dirty()){ e.preventDefault(); e.returnValue = ''; }
});

/* ------------------------------------------------------------------- boot */
async function start(){
  try{
    SCHEMA = await api('/api/admin/schema');
    const r = await api('/api/admin/content');
    DOC = r.content || {};
    SCHEMA.sections.forEach(s => {
      if(DOC[s.key] === undefined) DOC[s.key] = s.kind === 'collection' ? [] : {};
    });
    CLEAN = clone(DOC);
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    buildNav();
    open(SCHEMA.sections[0].key);
    refreshPublish();
  }catch(e){
    if(TOKEN) toast(e.message, true);
    signOut();
  }
}

function buildNav(){
  const nav = $('#snav');
  nav.innerHTML = '';
  const all = SCHEMA.sections.filter(s => !s.hidden);

  const SITE_KEYS = ['site','hero','stats','legal','conference','support'];
  const COLL_KEYS = ['people','chapters','events','projects','articles','opportunities','confEditions'];
  const site_wide = all.filter(s => SITE_KEYS.includes(s.key));
  const collections = all.filter(s => COLL_KEYS.includes(s.key));
  const pages = all.filter(s => s.key.startsWith('pages.'));

  const group = (label, items) => {
    if(!items.length) return;
    const h = el('div','grp',label);
    nav.appendChild(h);
    items.forEach(s => {
      const rows = s.kind === 'collection';
      const b = el('button', '', `<span>${esc(s.title)}</span>` +
        (rows ? `<span class="n" data-count="${esc(s.key)}"></span>` : ''));
      b.addEventListener('click', ()=> open(s.key));
      b.dataset.key = s.key;
      nav.appendChild(b);
    });
    nav.appendChild(el('div','sep'));
  };

  group('Site-wide settings', site_wide);
  group('Collections', collections);
  group('Pages (copy & hero images)', pages.sort((a,b)=>a.title.localeCompare(b.title)));

  counts();
}
function counts(){
  document.querySelectorAll('[data-count]').forEach(n => {
    const k = n.dataset.count;
    n.textContent = (DOC[k] || []).length || '';
  });
}

function open(key){
  SECTION = SCHEMA.sections.find(s => s.key === key);
  ROW = 0;
  document.querySelectorAll('#snav button').forEach(b =>
    b.classList.toggle('on', b.dataset.key === key));
  $('#secTitle').textContent = SECTION.title;
  $('#secBlurb').textContent = SECTION.blurb || '';
  draw();
}

/* ------------------------------------------------------------------ forms */
function fieldNode(field, get, set){
  const f = el('div', 'field');
  f.appendChild(el('label', '', esc(field.label)));
  if(field.help) f.appendChild(el('div', 'help', esc(field.help)));
  const t = field.type;
  let input;

  if(t === 'textarea' || t === 'markdown'){
    input = el('textarea');
    if(t === 'markdown') input.className = 'md';
    input.value = get() || '';
    input.addEventListener('input', ()=>{ set(input.value); markDirty(); });
  }
  else if(t === 'select'){
    input = el('select');
    input.appendChild(el('option', '', ''));
    (field.options || []).forEach(o => {
      const opt = el('option', '', esc(o)); opt.value = o; input.appendChild(opt);
    });
    input.value = get() || '';
    input.addEventListener('change', ()=>{ set(input.value); markDirty(); });
  }
  else if(t === 'tags'){
    input = el('input'); input.type = 'text';
    input.placeholder = 'Separate with commas';
    input.value = (get() || []).join(', ');
    input.addEventListener('input', ()=>{
      set(input.value.split(',').map(s=>s.trim()).filter(Boolean)); markDirty(); });
  }
  else if(t === 'image'){
    f.appendChild(imageField(get, set));
    return f;
  }
  else if(t === 'list'){
    f.appendChild(listField(field, get, set));
    return f;
  }
  else{
    input = el('input');
    input.type = ({url:'url', email:'email', date:'date', time:'time',
                   number:'number'})[t] || 'text';
    input.value = get() == null ? '' : get();
    input.addEventListener('input', ()=>{
      set(t === 'number' ? (input.value === '' ? null : Number(input.value)) : input.value);
      markDirty(); });
  }
  f.appendChild(input);
  return f;
}

function imageField(get, set){
  const box = el('div', 'img-f');
  const prev = el('div', 'img-p');
  const acts = el('div', 'img-a');
  const url  = el('input'); url.type = 'text'; url.placeholder = 'media/… or a full URL';
  const row  = el('div', 'row');
  const pick = el('button', 'btn ghost', 'Upload…'); pick.type = 'button';
  const del  = el('button', 'btn ghost danger', 'Remove'); del.type = 'button';
  const file = el('input'); file.type = 'file';
  file.accept = 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml,application/pdf,video/mp4,video/webm,video/quicktime';
  file.style.display = 'none';

  const paint = () => {
    const v = get() || '';
    const src = v && (v.startsWith('http') ? v : API + '/' + v);
    if(!v){
      prev.innerHTML = 'Nothing yet';
    }else if(/\.(mp4|webm|mov)$/i.test(v)){
      // a clip — show it, muted, so you can check you picked the right one
      prev.innerHTML = `<video src="${esc(src)}" muted playsinline preload="metadata"></video>`;
    }else if(/\.pdf$/i.test(v)){
      prev.innerHTML = 'PDF attached';
    }else{
      prev.innerHTML = `<img src="${esc(src)}" alt="">`;
    }
    url.value = v;
  };
  url.addEventListener('input', ()=>{ set(url.value); markDirty(); paint(); });
  pick.addEventListener('click', ()=> file.click());
  del.addEventListener('click', ()=>{ set(''); markDirty(); paint(); });
  file.addEventListener('change', async ()=>{
    if(!file.files[0]) return;
    const fd = new FormData(); fd.append('file', file.files[0]);
    pick.disabled = true; pick.textContent = 'Uploading…';
    try{
      const r = await api('/api/admin/media', {method:'POST', body: fd});
      set(r.url); markDirty(); paint();
      toast('Uploaded ' + r.filename);
    }catch(e){ toast(e.message, true); }
    pick.disabled = false; pick.textContent = 'Upload…';
    file.value = '';
  });

  row.append(pick, del);
  acts.append(url, row, file);
  box.append(prev, acts);
  paint();
  return box;
}

function listField(field, get, set){
  const wrap = el('div');
  const rows = el('div', 'list-rows');
  const add = el('button', 'btn ghost', '+ Add ' + field.label.toLowerCase().replace(/s$/, ''));
  add.type = 'button';

  const paint = () => {
    const list = get() || [];
    rows.innerHTML = '';
    list.forEach((row, i) => rows.appendChild(rowNode(field, list, row, i, paint, set)));
    if(!list.length) rows.appendChild(el('div', 'empty-note', 'Nothing here yet.'));
  };
  add.addEventListener('click', ()=>{
    const list = (get() || []).slice();
    list.push({});
    set(list); markDirty(); paint();
    const last = rows.querySelector('.row-item:last-of-type .row-hd');
    if(last) last.click();
  });
  wrap.append(rows, add);
  paint();
  return wrap;
}

function rowNode(field, list, row, i, repaint, set){
  const item = el('div', 'row-item');
  item.draggable = true;
  const label = row[field.label_field] || '';
  const hd = el('div', 'row-hd', `
    <span class="grip" title="Drag to reorder">⋮⋮</span>
    <span class="t ${label ? '' : 'empty'}">${esc(label || 'Untitled')}</span>
    <button class="x" type="button" title="Delete">×</button>`);
  const body = el('div', 'row-b hidden');

  hd.addEventListener('click', e => {
    if(e.target.closest('.x')) return;
    body.classList.toggle('hidden');
    if(!body.dataset.built){
      field.fields.forEach(sub => body.appendChild(
        fieldNode(sub, ()=> row[sub.key], v => { row[sub.key] = v; set(list.slice());
          const t = hd.querySelector('.t');
          const nv = row[field.label_field];
          t.textContent = nv || 'Untitled';
          t.className = 't' + (nv ? '' : ' empty');
        })));
      body.dataset.built = '1';
    }
  });
  hd.querySelector('.x').addEventListener('click', async ()=>{
    if(!await qa_confirm('Delete this entry? You can still undo it from revision history.')) return;
    const next = list.slice(); next.splice(i, 1);
    set(next); markDirty(); repaint();
  });

  item.addEventListener('dragstart', e => {
    item.classList.add('dragging');
    e.dataTransfer.setData('text/plain', String(i));
  });
  item.addEventListener('dragend', ()=> item.classList.remove('dragging'));
  item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('over'); });
  item.addEventListener('dragleave', ()=> item.classList.remove('over'));
  item.addEventListener('drop', e => {
    e.preventDefault(); item.classList.remove('over');
    const from = Number(e.dataTransfer.getData('text/plain'));
    if(Number.isNaN(from) || from === i) return;
    const next = list.slice();
    next.splice(i, 0, next.splice(from, 1)[0]);
    set(next); markDirty(); repaint();
  });

  item.append(hd, body);
  return item;
}

/* ------------------------------------------------------------------- draw */
function draw(){
  const pane = $('#pane');
  pane.innerHTML = '';
  if(!SECTION) return;

  if(SECTION.kind === 'single'){
    const card = el('div', 'card');
    const obj = DOC[SECTION.key] = DOC[SECTION.key] || {};
    SECTION.fields.forEach(f => card.appendChild(
      fieldNode(f, ()=> obj[f.key], v => { obj[f.key] = v; })));
    pane.appendChild(card);
    return;
  }

  // collection: a list on the left, the selected entry on the right
  const list = DOC[SECTION.key] = DOC[SECTION.key] || [];
  const coll = el('div', 'coll');
  const side = el('div', 'coll-list');
  const body = el('div');

  const addBtn = el('button', 'btn primary', '+ Add new');
  addBtn.type = 'button';
  addBtn.style.marginBottom = '8px';
  addBtn.addEventListener('click', ()=>{
    list.push({}); ROW = list.length - 1; markDirty(); counts(); draw();
  });
  side.appendChild(addBtn);

  list.forEach((row, i) => {
    const name = row[SECTION.label_field] || 'Untitled';
    const sub = row.role || row.type || row.country || row.category || '';
    const entry = el('div', 'entry');
    entry.draggable = true;
    entry.dataset.idx = String(i);

    const grip = el('div', 'row-grip', '⋮⋮');
    grip.title = 'Drag to reorder';

    const b = el('button', 'nb ' + (i === ROW ? 'on' : ''),
      `<span>${esc(name)}</span><span class="sub">${esc(sub)}</span>`);
    b.type = 'button';
    b.addEventListener('click', ()=>{ ROW = i; draw(); });

    const mvs = el('div', 'mvs');
    const up = el('button', '', '↑');
    up.type = 'button';
    up.title = 'Move up';
    up.disabled = i === 0;
    up.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(i === 0) return;
      const [it] = list.splice(i, 1);
      list.splice(i - 1, 0, it);
      if(ROW === i) ROW = i - 1;
      else if(ROW === i - 1) ROW = i;
      markDirty(); counts(); draw();
    });
    const down = el('button', '', '↓');
    down.type = 'button';
    down.title = 'Move down';
    down.disabled = i === list.length - 1;
    down.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(i === list.length - 1) return;
      const [it] = list.splice(i, 1);
      list.splice(i + 1, 0, it);
      if(ROW === i) ROW = i + 1;
      else if(ROW === i + 1) ROW = i;
      markDirty(); counts(); draw();
    });
    mvs.append(up, down);

    entry.append(grip, b, mvs);

    entry.addEventListener('dragstart', e => {
      entry.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'coll-' + String(i));
    });
    entry.addEventListener('dragend', ()=> entry.classList.remove('dragging'));
    entry.addEventListener('dragover', e => {
      if(String(e.dataTransfer.types || []).includes('text/plain') &&
         (e.dataTransfer.getData('text/plain') || '').startsWith('coll-')){
        e.preventDefault();
        entry.classList.add('over');
      }
    });
    entry.addEventListener('dragleave', ()=> entry.classList.remove('over'));
    entry.addEventListener('drop', e => {
      entry.classList.remove('over');
      const raw = e.dataTransfer.getData('text/plain') || '';
      if(!raw.startsWith('coll-')) return;
      e.preventDefault();
      const from = Number(raw.slice(5));
      const to = i;
      if(Number.isNaN(from) || from === to || from < 0 || from >= list.length) return;
      const [it] = list.splice(from, 1);
      list.splice(to, 0, it);
      let nRow = ROW;
      if(nRow === from) nRow = to;
      else if(from < to && nRow > from && nRow <= to) nRow -= 1;
      else if(from > to && nRow >= to && nRow < from) nRow += 1;
      ROW = nRow;
      markDirty(); counts(); draw();
    });

    side.appendChild(entry);
  });

  if(!list.length){
    body.appendChild(el('div', 'empty-note',
      'Nothing here yet. Use “Add new” to create the first entry.'));
  }else{
    const row = list[Math.min(ROW, list.length - 1)];
    const card = el('div', 'card');
    SECTION.fields.forEach(f => card.appendChild(
      fieldNode(f, ()=> row[f.key], v => { row[f.key] = v; })));
    const del = el('button', 'btn danger', 'Delete this entry');
    del.type = 'button';
    del.addEventListener('click', async ()=>{
      if(!await qa_confirm('Delete this entry?')) return;
      list.splice(ROW, 1); ROW = 0; markDirty(); counts(); draw();
    });
    card.appendChild(del);
    body.appendChild(card);
  }
  coll.append(side, body);
  pane.appendChild(coll);
}

/* ------------------------------------------------------------------- save */
$('#saveBtn').addEventListener('click', async ()=>{
  const b = $('#saveBtn');
  b.disabled = true; b.textContent = 'Saving…';
  try{
    const r = await api('/api/admin/content', {method:'PUT', body:{content: DOC}});
    DOC = r.content;
    SCHEMA.sections.forEach(s => {
      if(DOC[s.key] === undefined) DOC[s.key] = s.kind === 'collection' ? [] : {};
    });
    CLEAN = clone(DOC);
    $('#savedAt').textContent = 'Saved ' + new Date().toLocaleTimeString();
    counts(); draw(); markDirty();
    toast('Saved. Press “Publish to the website” to put it live.');
    refreshPublish();
  }catch(e){ toast(e.message, true); }
  b.textContent = 'Save';
  markDirty();
});

$('#revertBtn').addEventListener('click', async ()=>{
  if(!await qa_confirm('Discard your unsaved changes?')) return;
  DOC = clone(CLEAN); counts(); draw(); markDirty();
});

/* --------------------------------------------------------------- publish */
/* Saving stores the content on this computer. Publishing commits it and pushes,
   which is what makes the live website change. Keeping them separate means you
   can edit over several sittings and publish once, when you are ready. */
async function refreshPublish(){
  const state = $('#pubState'), btn = $('#pubBtn');
  try{
    const r = await api('/api/admin/publish');
    if(!r.ready){
      btn.disabled = true;
      state.textContent = r.reason || 'Publishing is unavailable.';
      state.title = r.reason || '';
      state.style.color = 'var(--red)';
      return;
    }
    btn.disabled = false;
    state.style.color = '';
    state.textContent = r.count
      ? `${r.count} change${r.count === 1 ? '' : 's'} waiting to publish`
      : 'Website is up to date';
    btn.classList.toggle('gold', r.count > 0);
    btn.classList.toggle('ghost', r.count === 0);
  }catch(e){
    btn.disabled = true;
    state.textContent = '';
  }
}

$('#pubBtn').addEventListener('click', async ()=>{
  if(dirty() && !await qa_confirm('You have unsaved changes. Publish without them?')) return;
  const b = $('#pubBtn');
  b.disabled = true; b.textContent = 'Publishing…';
  try{
    const note = await qa_prompt('Describe this update (optional)', 'Update site content');
    if(note === null){ b.disabled = false; b.textContent = 'Publish to the website'; return; }
    const r = await api('/api/admin/publish', {method:'POST', body:{message: note}});
    if(r.nothing) toast(r.message);
    else if(r.ok) toast(r.message);
    else toast(r.error || 'Publish failed', true);
  }catch(e){ toast(e.message, true); }
  b.textContent = 'Publish to the website';
  refreshPublish();
});

/* --------------------------------------------------------------- history */
$('#revBtn').addEventListener('click', async ()=>{
  try{
    const r = await api('/api/admin/revisions');
    const pane = $('#pane');
    $('#secTitle').textContent = 'Revision history';
    $('#secBlurb').textContent = 'Every save is kept. Restoring one creates a new save, ' +
      'so nothing is destroyed either way.';
    document.querySelectorAll('#snav button').forEach(b => b.classList.remove('on'));
    pane.innerHTML = '';
    const card = el('div', 'card');
    if(!r.revisions.length) card.appendChild(el('div', 'empty-note', 'No saves yet.'));
    r.revisions.forEach((rev, i) => {
      const line = el('div', 'rev', `
        <span><b>#${rev.id}</b> ${i === 0 ? '<span style="color:var(--green)">· current</span>' : ''}
          <span class="when">${esc(new Date(rev.created).toLocaleString())}${rev.note ? ' · ' + esc(rev.note) : ''}</span></span>`);
      if(i > 0){
        const b = el('button', 'btn ghost', 'Restore'); b.type = 'button';
        b.addEventListener('click', async ()=>{
          if(!await qa_confirm('Restore revision #' + rev.id + '?')) return;
          try{
            const res = await api('/api/admin/rollback/' + rev.id, {method:'POST'});
            DOC = res.content; CLEAN = clone(DOC);
            toast('Restored revision #' + rev.id);
            counts(); open(SCHEMA.sections[0].key); markDirty();
          }catch(e){ toast(e.message, true); }
        });
        line.appendChild(b);
      }
      card.appendChild(line);
    });
    pane.appendChild(card);
  }catch(e){ toast(e.message, true); }
});

/* ---------------------------------------------------------- submissions */
$('#subBtn').addEventListener('click', async ()=>{
  try{
    const r = await api('/api/admin/submissions');
    const pane = $('#pane');
    $('#secTitle').textContent = 'Form submissions';
    $('#secBlurb').textContent = 'Every contact / join / newsletter submission received. ' +
      (r.forward_smtp_configured || r.forward_resend_configured
        ? 'Email forwarding is on — forwarded items are marked.'
        : 'Email forwarding is OFF — configure QA_SMTP_* or QA_RESEND_* in the environment ' +
          '(see DEPLOY.md) so these are mailed straight to ' + esc(r.inbox) + '.');
    document.querySelectorAll('#snav button').forEach(b => b.classList.remove('on'));
    pane.innerHTML = '';

    const banner = el('div', 'banner');
    banner.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap">
        <div>
          <b>${esc(String(r.count))}</b> submission${r.count === 1 ? '' : 's'} received ·
          inbox: <b>${esc(r.inbox)}</b> ·
          SMTP: <b>${r.forward_smtp_configured ? 'on' : 'off'}</b> ·
          Resend: <b>${r.forward_resend_configured ? 'on' : 'off'}</b>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" id="subRefresh" type="button">Refresh</button>
        </div>
      </div>`;
    pane.appendChild(banner);

    const list = el('div');
    if(!r.items.length){
      list.appendChild(el('div', 'empty-note', 'No submissions yet.'));
    }
    r.items.forEach(row => {
      const card = el('div', 'card');
      const fields = row.fields || {};
      const when = new Date(row.created).toLocaleString();
      const head = el('div', 'rev', `
        <div>
          <b style="font-size:1rem">${esc((fields.name || fields.full_name || 'Anonymous'))}</b>
          ${fields.email ? `· <a href="mailto:${esc(fields.email)}">${esc(fields.email)}</a>` : ''}
          <div class="when">${esc(row.form)} · ${when}
            ${row.forwarded ? ' · <span style="color:var(--green)">✓ forwarded by email</span>'
                             : ' · <span style="color:var(--gold)">stored locally only</span>'}
          </div>
        </div>`);
      const buttons = el('div');
      const fwd = el('button', 'btn ghost', row.forwarded ? 'Re-send' : 'Send email');
      fwd.type = 'button';
      fwd.addEventListener('click', async ()=>{
        try{
          const res = await api(`/api/admin/submissions/${encodeURIComponent(row.id)}/forward`, {method:'POST'});
          toast(res.ok ? 'Forwarded to ' + r.inbox : (res.error || 'Forward failed'), !res.ok);
          if(res.ok) row.forwarded = true;
        }catch(e){ toast(e.message, true); }
      });
      buttons.append(fwd);
      head.append(buttons);
      card.appendChild(head);
      const body = el('div');
      body.style.marginTop = '8px';
      for(const k of Object.keys(fields)){
        const rowEl = el('div');
        rowEl.style.cssText = 'display:grid;grid-template-columns:140px 1fr;gap:8px 16px;padding:6px 0;border-top:1px dashed var(--line)';
        rowEl.appendChild(el('div', '', `<b>${esc(k)}</b>`)).style.color = 'var(--ink-2)';
        const valCol = el('div');
        valCol.style.whiteSpace = 'pre-wrap';
        valCol.textContent = fields[k];
        rowEl.appendChild(valCol);
        body.appendChild(rowEl);
      }
      card.appendChild(body);
      list.appendChild(card);
    });
    pane.appendChild(list);

    $('#subRefresh').addEventListener('click', ()=> $('#subBtn').click());
  }catch(e){ toast(e.message, true); }
});

/* ---------------------------------------------------------------- kickoff */
if(TOKEN) start(); else { $('#login').classList.remove('hidden'); }
</script>
